<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Bootstrap Experiment</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Aapki Custom External CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Bootstrap Navbar Component -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark py-3">
        <div class="container px-4">
            <a class="navbar-brand fs-4" href="#">TechStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="#">Products</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. Responsive Cards Layout Container -->
    <main class="container my-5 main-content">
        <div class="row g-4 justify-content-center">
            
            <!-- Card 1: Laptop -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 product-card p-2">
                    <div class="card-img-container">
                        <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500&auto=format&fit=crop&q=60" alt="Laptop">
                    </div>
                    <div class="card-body d-flex flex-column align-items-start">
                        <h5 class="card-title fw-semibold text-dark mb-1">Laptop</h5>
                        <p class="card-text text-muted small mb-3">High performance laptop</p>
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <span class="fw-bold text-dark">₹50,000</span>
                            <span class="badge bg-success rounded-1 py-1.5 px-2">New</span>
                        </div>
                        <button class="btn btn-primary px-3 rounded-1 mt-auto" data-bs-toggle="modal" data-bs-target="#productModal" data-bs-title="Laptop" data-bs-desc="High performance machine suited for heavy workloads, coding, and multitasking.">View Details</button>
                    </div>
                </div>
            </div>

            <!-- Card 2: Mobile -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 product-card p-2">
                    <div class="card-img-container">
                        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&auto=format&fit=crop&q=60" alt="Mobile">
                    </div>
                    <div class="card-body d-flex flex-column align-items-start">
                        <h5 class="card-title fw-semibold text-dark mb-1">Mobile</h5>
                        <p class="card-text text-muted small mb-3">Latest smartphone</p>
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <span class="fw-bold text-dark">₹30,000</span>
                            <span class="badge bg-danger rounded-1 py-1.5 px-2">Sale</span>
                        </div>
                        <button class="btn btn-primary px-3 rounded-1 mt-auto" data-bs-toggle="modal" data-bs-target="#productModal" data-bs-title="Mobile" data-bs-desc="The latest feature-packed smartphone featuring an outstanding display, camera system, and optimized battery performance.">View Details</button>
                    </div>
                </div>
            </div>

            <!-- Card 3: Headphones -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 product-card p-2">
                    <div class="card-img-container">
                        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" alt="Headphones">
                    </div>
                    <div class="card-body d-flex flex-column align-items-start">
                        <h5 class="card-title fw-semibold text-dark mb-1">Headphones</h5>
                        <p class="card-text text-muted small mb-3">Noise cancelling</p>
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <span class="fw-bold text-dark">₹5,000</span>
                            <span class="badge bg-success rounded-1 py-1.5 px-2">New</span>
                        </div>
                        <button class="btn btn-primary px-3 rounded-1 mt-auto" data-bs-toggle="modal" data-bs-target="#productModal" data-bs-title="Headphones" data-bs-desc="Immersive audio experience equipped with intelligent active noise cancellation and soft ergonomic ear cups.">View Details</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 3. Bootstrap Modal Component -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="productModalLabel">Product Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modalProductDesc">Loading details...</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. Footer Component -->
    <footer class="bg-dark text-secondary text-center py-3 text-white-50 small mt-auto">
        <div class="container">
            &copy; 2026 TechStore | Follow us on social media
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- JavaScript to Handle Modal Content Dynamically -->
    <script>
        const productModal = document.getElementById('productModal')
        if (productModal) {
            productModal.addEventListener('show.bs.modal', event => {
                const button = event.relatedTarget
                const title = button.getAttribute('data-bs-title')
                const description = button.getAttribute('data-bs-desc')
                
                const modalTitle = productModal.querySelector('.modal-title')
                const modalBodyDesc = productModal.querySelector('#modalProductDesc')

                modalTitle.textContent = title
                modalBodyDesc.textContent = description
            })
        }
    </script>
</body>
</html>
