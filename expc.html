<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation and Event Handling</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
            transition: 0.5s;
        }

        h1 {
            color: darkblue;
        }

        #para {
            width: 60%;
            margin: auto;
            font-size: 20px;
        }

        button {
            padding: 10px 15px;
            margin: 10px;
            border: none;
            background-color: steelblue;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        input {
            padding: 10px;
            width: 300px;
        }
    </style>
</head>

<body>

    <h1 id="heading">Welcome to JavaScript DOM</h1>

    <input type="text" id="message" placeholder="Enter new heading text">

    <br><br>

    <button id="textBtn">Change Heading</button>

    <button id="bgBtn">Change Background</button>

    <button id="fontBtn">Change Font Size</button>

    <button id="toggleBtn">Show / Hide Paragraph</button>

    <button id="resetBtn">Reset Page</button>

    <p id="para">
        This is a sample paragraph. JavaScript events can dynamically change content.
    </p>

    <script>

        // Access elements
        const heading = document.getElementById("heading");
        const message = document.getElementById("message");
        const para = document.getElementById("para");

        // Change heading text using onclick
        document.getElementById("textBtn").onclick = function () {

            if(message.value == "")
            {
                heading.innerText = "Please enter some text";
            }
            else
            {
                heading.innerText = message.value;
            }
        };



        // Change background color using addEventListener
        document.getElementById("bgBtn").addEventListener("click", function () {

            document.body.style.backgroundColor = "lightyellow";
            document.body.style.backgroundColor = "lightgreen";
        });



        // Change font size using onmouseover
        document.getElementById("fontBtn").onmouseover = function () {

            heading.style.fontSize = "50px";

        };



        // Show/Hide paragraph
        let visible = true;

        document.getElementById("toggleBtn").addEventListener("click", function () {

            if(visible)
            {
                para.style.display = "none";
                visible = false;
            }
            else
            {
                para.style.display = "block";
                visible = true;
            }

        });



        // onchange event for input field
        message.onchange = function () {

            console.log("Input value changed");

        };



        // Reset page
        document.getElementById("resetBtn").onclick = function () {

            heading.innerText = "Welcome to JavaScript DOM";

            heading.style.fontSize = "32px";

            document.body.style.backgroundColor = "white";

            para.style.display = "block";

            message.value = "";

            visible = true;
        };

    </script>

</body>
</html>
